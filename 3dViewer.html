<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Model Viewer</title>

<link rel="icon" type="image/x-icon" href="img/favicon.ico">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
margin:0;
background:white;
}

model-viewer{
width:100vw;
height:100vh;
}
</style>

</head>

<body>

<model-viewer
src="3dmodel.glb"
camera-controls
touch-action="pan-y"
shadow-intensity="1"
exposure="1"
environment-image="neutral"
camera-orbit="45deg 60deg 4m"

>

</model-viewer>

</body>
</html>
